<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli Aja Sukodadi</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
 <!-- KONTEN UTAMA ANDA YANG SUDAH ADA -->
    <div id="main-content" style="display: none;">
        <!-- SEMUA KONTEN INDEX.HTML ANDA MASUKKAN DI SINI -->
    </div>

    <!-- SPLASH SCREEN BARU - TAMBAHKAN INI -->
    <div id="splash-screen" class="splash-overlay">
        <div class="splash-content">
            <img src="beliaja.gif" width="300℅" alt="gmbr gif">
            <h1 class="splash-title">Loading...</h1>
            <div class="splash-loader"></div>
            <p class="splash-subtitle">Mohon tunggu sebentar</p>
        </div>
    </div>

    <!-- CSS SPLASH SCREEN -->
    <style>
        /* SPLASH SCREEN STYLES */
        .splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #006400 0%, #006400 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.8s ease-out;
        }

        .splash-content {
            text-align: center;
            color: white;
        }

        .splash-logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: bounce 1.5s infinite;
        }

        .splash-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .splash-subtitle {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 1rem;
        }

        .splash-loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        /* EFEK FADE OUT */
        .splash-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>

    <!-- JAVASCRIPT SPLASH SCREEN -->
    <script>
        // Auto hide splash setelah 3 detik
        setTimeout(() => {
            hideSplash();
        }, 3000);

        function hideSplash() {
            const splash = document.getElementById('splash-screen');
            const mainContent = document.getElementById('main-content');
            
            // Tambah efek fade out
            splash.classList.add('fade-out');
            
            // Tampilkan konten utama
            setTimeout(() => {
                splash.style.display = 'none';
                mainContent.style.display = 'block';
            }, 800);
        }

        // Opsional: Hide splash saat user klik/touch
        document.getElementById('splash-screen').addEventListener('click', hideSplash);
    </script>
    
    <!-- Header -->
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo"><p>
                    <h2>Beli Aja Sukodadi <img src="beliaja1.png" width="60℅" alt="logo beli aja">
                    </h2>
                </div>
        
                    <li><a href="#cart" class="cart-btn">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count" id="cartCount">0</span>
                    </a></li>
            </div>
        </nav>
        
    </header>
    
    <!-- Menu Section -->
    <section id="menu" class="menu-section">
        <div class="container">
            <h2 class="section-title">Menu Kami</h2>
            <div class="menu-categories">
                <button class="category-btn active" data-category="all">Semua</button>
                <button class="category-btn" data-category="makanan">Makanan</button>
                <button class="category-btn" data-category="minuman">Minuman</button>
                <button class="category-btn" data-category="snack">Snack</button>
            </div>
            <div class="menu-grid" id="menuGrid">
                <!-- Menu items akan dimuat oleh JavaScript -->
            </div>
        </div>
    </section>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-shopping-cart"></i> Keranjang Pesanan</h3>
                <span class="close">&times;</span>
            </div>
            <div class="cart-items" id="cartItems">
                <p>Keranjang kosong</p>
            </div>
            <div class="cart-total">
                <h4>Total: <span id="cartTotal">Rp 0</span></h4>
            </div>
            <div class="cart-actions">
                <button class="btn-clear" id="clearCart">Kosongkan Keranjang</button>
                <a href="#" class="btn-wa" id="whatsappBtn">
                    <i class="fab fa-whatsapp"></i> Beli via WhatsApp
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <img src="logo.png" width="100℅" alt="logo ngodingasik">
            <img src="logo1.png" width="100℅" alt="logo JI">
            <p>&copy; 2026 Ngoding_asik. Semua hak cipta dilindungi.</p>
            <p>Mau dibuatin aplikasi? Hub WhatsApp: <a href="https://wa.me/6289644300777">089644300777</a></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
